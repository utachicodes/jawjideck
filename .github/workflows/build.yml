name: Build Jawji

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (e.g. v0.0.2-alpha). Leave empty for build-only.'
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NAME=Jawji-${VERSION}-win" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync version to desktop app
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const root = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            root.version = '${{ env.VERSION }}';
            fs.writeFileSync('./package.json', JSON.stringify(root, null, 2) + '\n');
            const desktop = JSON.parse(fs.readFileSync('./apps/desktop/package.json', 'utf8'));
            desktop.version = '${{ env.VERSION }}';
            fs.writeFileSync('./apps/desktop/package.json', JSON.stringify(desktop, null, 2) + '\n');
          "

      - name: Build packages
        run: pnpm build

      - name: Build Windows x64
        working-directory: apps/desktop
        run: pnpm package --win --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-installer
          path: apps/desktop/release/*setup*.exe

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-portable
          path: apps/desktop/release/*portable*.exe

      - name: Upload Windows update metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-meta
          path: |
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NAME=Jawji-${VERSION}-linux" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync version to desktop app
        run: |
          node -e "
            const fs = require('fs');
            const root = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            root.version = '${{ env.VERSION }}';
            fs.writeFileSync('./package.json', JSON.stringify(root, null, 2) + '\n');
            const desktop = JSON.parse(fs.readFileSync('./apps/desktop/package.json', 'utf8'));
            desktop.version = '${{ env.VERSION }}';
            fs.writeFileSync('./apps/desktop/package.json', JSON.stringify(desktop, null, 2) + '\n');
          "

      - name: Build packages
        run: pnpm build

      - name: Build Linux x64
        working-directory: apps/desktop
        run: pnpm package --linux --x64 --publish never

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-appimage
          path: apps/desktop/release/*.AppImage

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-deb
          path: apps/desktop/release/*.deb

      - name: Upload Linux update metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.BUILD_NAME }}-meta
          path: |
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NAME=Jawji-${VERSION}-mac" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync version to desktop app
        run: |
          node -e "
            const fs = require('fs');
            const root = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            root.version = '${{ env.VERSION }}';
            fs.writeFileSync('./package.json', JSON.stringify(root, null, 2) + '\n');
            const desktop = JSON.parse(fs.readFileSync('./apps/desktop/package.json', 'utf8'));
            desktop.version = '${{ env.VERSION }}';
            fs.writeFileSync('./apps/desktop/package.json', JSON.stringify(desktop, null, 2) + '\n');
          "

      - name: Build packages
        run: pnpm build

      - name: Build macOS universal (unsigned)
        working-directory: apps/desktop
        env:
          # No Developer ID cert is configured yet: force electron-builder to skip
          # code signing entirely instead of falling back to an ad-hoc keychain
          # identity it may find on the runner. Users get a Gatekeeper
          # "unidentified developer" prompt until this project has a cert.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm package --mac --universal --publish never

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-dmg
          path: apps/desktop/release/*.dmg

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-zip
          path: apps/desktop/release/*.zip

      - name: Upload macOS update metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.BUILD_NAME }}-meta
          path: |
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: ignore

  # Upload artifacts to a release
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'release' || inputs.release_tag != '') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ inputs.release_tag }}" >> $GITHUB_ENV
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            artifacts/**/*.exe
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.zip
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${files[@]}"
